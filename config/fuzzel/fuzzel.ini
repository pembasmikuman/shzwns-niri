[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=yes
terminal=alacritty -e
layer=top
prompt="> "
width=34
lines=12
horizontal-pad=30
vertical-pad=18
inner-pad=14

[colors]
background=#2d2a21f0
text=#e9e2d4ff
prompt=#dfc56dff
placeholder=#cec6b4ff
input=#e9e2d4ff
match=#d3c6a1ff
selection=#564500ff
selection-text=#fde186ff
selection-match=#dfc56dff
border=#dfc56dff

[border]
width=2
radius=20
