# matugen — wallpaper → every app
[config]
reload_apps = false
set_wallpaper = false

[templates.waybar]
input_path = '~/.config/matugen/templates/colors.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'sh -c "pkill -x waybar 2>/dev/null; sleep 0.3; setsid nohup waybar -c $HOME/.config/waybar/config.jsonc -s $HOME/.config/waybar/style.css >/dev/null 2>&1 < /dev/null &"'

[templates.fuzzel]
input_path = '~/.config/matugen/templates/fuzzel.ini'
output_path = '~/.config/fuzzel/fuzzel.ini'

[templates.mako]
input_path = '~/.config/matugen/templates/mako.conf'
output_path = '~/.config/mako/config'
post_hook = 'makoctl reload'

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty.conf'
output_path = '~/.config/kitty/rice-theme.conf'
post_hook = 'pkill -SIGUSR1 kitty 2>/dev/null || true'

[templates.niri]
input_path = '~/.config/matugen/templates/niri-colors.kdl'
output_path = '~/.config/niri/rice-colors.kdl'

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-3.0/gtk.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk.css'
output_path = '~/.config/gtk-4.0/gtk.css'
