[main]
font=JetBrainsMono Nerd Font:size=12
dpi-aware=yes
terminal=alacritty -e
layer=top
prompt="> "
width=34
lines=12
horizontal-pad=30
vertical-pad=18
inner-pad=14

[colors]
background={{colors.surface_container_high.default.hex}}f0
text={{colors.on_surface.default.hex}}ff
prompt={{colors.primary.default.hex}}ff
placeholder={{colors.on_surface_variant.default.hex}}ff
input={{colors.on_surface.default.hex}}ff
match={{colors.secondary.default.hex}}ff
selection={{colors.primary_container.default.hex}}ff
selection-text={{colors.on_primary_container.default.hex}}ff
selection-match={{colors.primary.default.hex}}ff
border={{colors.primary.default.hex}}ff

[border]
width=2
radius=20
