[colors.primary]
background = "{{colors.surface_container_low.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"

[colors.cursor]
cursor = "{{colors.primary.default.hex}}"
text = "{{colors.surface_container_low.default.hex}}"

[colors.selection]
background = "{{colors.primary_container.default.hex}}"
text = "{{colors.on_primary_container.default.hex}}"

[colors.normal]
black   = "{{colors.outline.default.hex}}"
red     = "{{colors.error.default.hex}}"
green   = "{{colors.tertiary.default.hex}}"
yellow  = "{{colors.secondary.default.hex}}"
blue    = "{{colors.primary.default.hex}}"
magenta = "{{colors.tertiary_container.default.hex}}"
cyan    = "{{colors.secondary_container.default.hex}}"
white   = "{{colors.on_surface.default.hex}}"

[colors.bright]
black   = "{{colors.outline_variant.default.hex}}"
red     = "{{colors.error.default.hex}}"
green   = "{{colors.tertiary.default.hex}}"
yellow  = "{{colors.primary.default.hex}}"
blue    = "{{colors.secondary.default.hex}}"
magenta = "{{colors.primary_container.default.hex}}"
cyan    = "{{colors.secondary_container.default.hex}}"
white   = "#ffffff"
